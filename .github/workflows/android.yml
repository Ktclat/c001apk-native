name: Native Android checks
on:
  push:
    branches: [main, test/native-media-recovery-20261028]
  pull_request:
  workflow_dispatch:
    inputs:
      actual_ui:
        description: 'Optional synthetic actual-UI gate; requires explicit reviewed-source dispatch authorization'
        type: boolean
        default: false
      approved_sha:
        description: 'Exact reviewed test-branch SHA (required for actual UI)'
        type: string
        default: ''
      network_boundary_approved:
        description: 'Parent and independent reviewer approved the exact reject-only network boundary'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}-${{ inputs.actual_ui && 'actual-ui' || 'source' }}
  cancel-in-progress: ${{ !inputs.actual_ui }}
jobs:
  debug:
    if: github.event_name != 'workflow_dispatch' || !inputs.actual_ui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install required official Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # Official runner SDK is present but its command-line tools are not necessarily on PATH.
          # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
          sdk_manager="$(find "${ANDROID_HOME:?}/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          test -n "$sdk_manager" && test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and prepare pinned font resources
        run: |
          python3 -m unittest discover -s app/tools -p 'test_fetch_fonts.py' -v
          python3 app/tools/fetch_fonts.py
          python3 app/tools/fetch_fonts.py --offline
      - name: Test offline original-emoticon verifier
        run: python3 -m unittest discover -s app/tools -p 'test_verify_emoticon_apk.py' -v
      - name: Verify local source provenance privacy and determinism
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          javac -d "$out" buildSrc/src/main/java/io/github/ktclat/build/NativeBuildProvenance.java buildSrc/src/test/java/io/github/ktclat/build/NativeBuildProvenanceSelfTest.java
          java -cp "$out" io.github.ktclat.build.NativeBuildProvenanceSelfTest
      - name: Test device-evidence gates without emulator or network
        run: python3 -B -m unittest discover -s tools/qa-github -p 'test_*.py' -v
      - name: Build debug, synthetic tests, and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug
      - name: Verify all 183 original emoticons inside the built APK
        run: python3 app/tools/verify_emoticon_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Preserve verification reports only (no APK publication)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-source-and-synthetic-checks-no-apk
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/verification/
            !app/build/**/*.apk
            !app/build/**/*.aab
            !app/build/**/*.p12
            !app/build/**/*.jks
            !app/build/**/*.keystore
            !app/build/**/*.pem
            !app/build/**/*.key
          if-no-files-found: warn
          retention-days: 7

  actual-ui:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' && inputs.actual_ui && github.ref == 'refs/heads/test/native-media-recovery-20261028' && inputs.network_boundary_approved
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QA_APPROVED_SHA: ${{ inputs.approved_sha }}
      QA_NETWORK_APPROVED: ${{ inputs.network_boundary_approved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set task-owned temporary directories after runner allocation
        shell: bash
        run: |
          printf 'QA_PRIVATE=%s/native-ui-private\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'QA_PUBLIC=%s/native-ui-public\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require same-SHA ordinary source CI and explicit approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/qa-github/check_unit_gate.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Bounded sequential build and new task AVD preparation (no boot)
        run: |
          python3 tools/recovery/runner/run_owned.py \
            --lock "$RUNNER_TEMP/native-ui-build.lock" --evidence "$QA_PRIVATE/build-owner" \
            --cwd "$GITHUB_WORKSPACE" --seconds 1500 -- bash tools/qa-github/prepare.sh
      - name: Sole software emulator, proxy boundary, source-bound scenarios, cleanup
        run: |
          python3 tools/recovery/runner/run_owned.py \
            --lock "$RUNNER_TEMP/native-ui-runtime.lock" --evidence "$QA_PRIVATE/runtime-owner" \
            --cwd "$GITHUB_WORKSPACE" --seconds 3000 -- python3 tools/qa-github/run_emulator.py
      - name: Stage only allowlisted non-sensitive review evidence
        id: review_stage
        if: always()
        run: python3 tools/qa-github/stage_review.py
      - name: Preserve originals for independent review (never APKs/keys)
        if: always() && steps.review_stage.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-actual-ui-pending-independent-review-${{ github.sha }}
          path: qa-public-artifact/
          if-no-files-found: warn
          retention-days: 7
