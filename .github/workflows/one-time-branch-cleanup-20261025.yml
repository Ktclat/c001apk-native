# One-time cleanup. Remove this file after the terminal result is inspected.
name: One-time audited branch cleanup (2026-10-25)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-branch-cleanup-20261025.yml']
permissions: {}
concurrency:
  group: one-time-audited-branch-cleanup-20261025
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Ktclat/c001apk-native' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify every fixed target, then atomically delete only those refs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_CLEANUP'
          """One reviewed, finite cleanup. No checkout, input refs, or mutation retries."""
          import datetime
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          CONFIG = {'repository': 'Ktclat/c001apk-native',
           'baseline': 'b17b69568ec9bd97fe6a01e3ca3494e30100368e',
           'workflow_path': '.github/workflows/one-time-branch-cleanup-20261025.yml',
           'expires_at': '2026-10-26T23:59:59+00:00',
           'targets': [{'branch': 'feat/my-scoped-unread-badges',
                        'sha': '0f4bfbd7db788c7a91675b21abda3b2ccc3e85c8',
                        'pr': 13,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'fix/settings-category-scroll-isolation',
                        'sha': '5106fa2b4672661bb1fec7d22ae53209b8df4b19',
                        'pr': 12,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'implementation/about-license-page',
                        'sha': '43148be35742bc02e50814f5d880b3dff01c5aa4',
                        'pr': 11,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'implementation/gallery-loading-retry',
                        'sha': 'ae467585e53bd3ad0f2801e39794356f0975088e',
                        'pr': 9,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'implementation/home-icon-grid-restoration',
                        'sha': '8a416dfa05e062d68c5aa1d60c3391baf871f955',
                        'pr': 8,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'implementation/native-foundation',
                        'sha': '49c225942e1a9c966304902f323c884c3345bd5c',
                        'pr': 1,
                        'base': 'main'},
                       {'branch': 'implementation/text-emoticon-picker',
                        'sha': '9f0668c602649292f53bbce9c90ea1ecc64d752b',
                        'pr': 10,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'sync/upstream-and-my-refresh-20261024',
                        'sha': '6f01d49540c82a2b1e24d4b4fb6cc67670c6d327',
                        'pr': 14,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'validation/home-request-evidence',
                        'sha': '8157f08f22bc23c7c82a19cebbcbdb3d54a46dea',
                        'pr': 7,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'validation/image-composer-ci',
                        'sha': 'b4f25a2e1e1a085b27f36314e5953a9ac08ad538',
                        'pr': 6,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'validation/reader-status-ci',
                        'sha': '5ad82975470db265c13358930514c062be2583c2',
                        'pr': 3,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'validation/return-dispatch-ci',
                        'sha': '7900e391eadc8870e9891116b067743c23554de8',
                        'pr': 4,
                        'base': 'implementation/native-foundation'},
                       {'branch': 'validation/structured-article-ci',
                        'sha': 'ca54bd8c75938b73bc6b3c88683529d66e60b341',
                        'pr': 2,
                        'base': 'implementation/native-foundation'}],
           'preserved': {'validation/reply-readiness-trace': '8449eeac3f4a9fca3d2b27f44eb04155dcd3f2b2'}}
          WORKFLOW_PATH = '.github/workflows/one-time-branch-cleanup-20261025.yml'
          SHA = re.compile(r'[0-9a-f]{40}\Z')
          BRANCH = re.compile(r'[A-Za-z0-9][A-Za-z0-9._/-]*\Z')


          class SafetyError(Exception):
              """A safe, credential-free explanation; no raw API or subprocess output."""


          def require(condition, message):
              if not condition:
                  raise SafetyError(message)


          def valid_branch(name):
              return (isinstance(name, str) and BRANCH.fullmatch(name) is not None
                      and not any(x in name for x in ('..', '//', '@{'))
                      and not name.endswith(('/', '.'))
                      and all(not p.startswith('.') and not p.endswith('.lock')
                              for p in name.split('/')))


          def validate_config(config):
              counts = {'Ktclat/c001apk': 6, 'Ktclat/c001apk-native': 13}
              require(config['repository'] in counts, 'Repository is outside the fixed scope.')
              require(SHA.fullmatch(config['baseline']) is not None, 'Invalid audited main SHA.')
              require(config['workflow_path'] == WORKFLOW_PATH, 'Unexpected workflow path.')
              targets = config['targets']
              require(len(targets) == counts[config['repository']], 'Unexpected target count.')
              names = [target['branch'] for target in targets]
              require(len(set(names)) == len(names), 'Duplicate cleanup target.')
              preserved = {'main', 'validation/reply-readiness-trace'}
              for target in targets:
                  name = target['branch']
                  require(valid_branch(name) and name not in preserved, 'Unsafe or preserved target ref.')
                  require(SHA.fullmatch(target['sha']) is not None, 'Invalid target SHA.')
                  require(type(target['pr']) is int and target['pr'] > 0, 'Invalid pull request number.')
                  require(target['base'] in ('main', 'implementation/native-foundation'), 'Unexpected PR base.')
                  if 'squash' in target:
                      require(config['repository'] == 'Ktclat/c001apk'
                              and name == 'review/floating-nav-ux-audit'
                              and target['pr'] == 1
                              and target['sha'] == 'd254244af7fb0429127953666382b4ffc952cec3'
                              and target['squash'] == 'b1eac751e6050b9f528648b11a7ca110bdc70821'
                              and target['tree'] == '5e9b12da08e82dda86830503c50bc6b9815e84b1',
                              'Unrecognized squash exception.')
              expected_preserved = ({'validation/reply-readiness-trace':
                                     '8449eeac3f4a9fca3d2b27f44eb04155dcd3f2b2'}
                                    if config['repository'].endswith('-native') else {})
              require(config['preserved'] == expected_preserved, 'Preserved inventory changed.')


          def validate_context(config, env, event, now):
              validate_config(config)
              repo = config['repository']
              require(env.get('GITHUB_REPOSITORY') == repo, 'Unexpected executing repository.')
              require(env.get('GITHUB_SERVER_URL') == 'https://github.com', 'Unexpected GitHub server.')
              require(env.get('GITHUB_API_URL') == 'https://api.github.com', 'Unexpected API server.')
              require(env.get('GITHUB_EVENT_NAME') == 'push', 'Only the original main push is allowed.')
              require(env.get('GITHUB_REF') == 'refs/heads/main', 'Only main may start cleanup.')
              require(env.get('GITHUB_REF_TYPE') == 'branch', 'Unexpected ref type.')
              require(env.get('GITHUB_RUN_ATTEMPT') == '1', 'Reruns are forbidden; inspect the first outcome.')
              run_sha = env.get('GITHUB_SHA', '')
              require(SHA.fullmatch(run_sha) is not None, 'Invalid run SHA.')
              require(env.get('GITHUB_WORKFLOW_REF') == repo + '/' + WORKFLOW_PATH + '@refs/heads/main',
                      'Unexpected workflow identity.')
              require(env.get('GITHUB_WORKFLOW_SHA') == run_sha, 'Workflow SHA is not the pushed commit.')
              require(now <= datetime.datetime.fromisoformat(config['expires_at']), 'Cleanup approval window expired.')
              require(event.get('repository', {}).get('full_name') == repo, 'Event repository mismatch.')
              require(event.get('repository', {}).get('default_branch') == 'main', 'Event default is not main.')
              require(event.get('ref') == 'refs/heads/main' and event.get('before') == config['baseline']
                      and event.get('after') == run_sha, 'Push is not directly on the audited main.')
              require(all(event.get(k) is False for k in ('created', 'deleted', 'forced')),
                      'Creation, deletion, forced, or malformed push event.')
              commits = event.get('commits')
              require(isinstance(commits, list) and len(commits) == 1
                      and commits[0].get('id') == run_sha
                      and event.get('head_commit', {}).get('id') == run_sha,
                      'Expected exactly one workflow-only publication commit.')
              return run_sha


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise SafetyError('API redirect refused.')


          class GitHubReadAPI:
              """Only GET, only api.github.com, no redirects, bounded data, no response logging."""
              def __init__(self, repository, token):
                  self.prefix = '/repos/' + repository
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())

              def get(self, suffix, allow_404=False):
                  require(suffix == '' or (suffix.startswith('/') and not suffix.startswith('//')),
                          'Unsafe API path.')
                  request = urllib.request.Request('https://api.github.com' + self.prefix + suffix,
                      headers={'Accept': 'application/vnd.github+json',
                               'Authorization': 'Bearer ' + self.token,
                               'X-GitHub-Api-Version': '2022-11-28',
                               'User-Agent': 'reviewed-one-time-branch-cleanup'}, method='GET')
                  try:
                      with self.opener.open(request, timeout=30) as response:
                          require(response.status == 200, 'Unexpected API status.')
                          require('rel="next"' not in response.headers.get('Link', ''),
                                  'Paginated result refused; preflight must be complete.')
                          body = response.read(4_000_001)
                          require(len(body) <= 4_000_000, 'Oversized API result refused.')
                          return json.loads(body)
                  except urllib.error.HTTPError as error:
                      if allow_404 and error.code == 404:
                          return None
                      raise SafetyError('Read-only GitHub API request failed (HTTP %s).' % error.code) from None
                  except (urllib.error.URLError, TimeoutError, ValueError):
                      raise SafetyError('Read-only GitHub API request failed; no mutation retried.') from None


          def branch_path(branch):
              return '/branches/' + urllib.parse.quote(branch, safe='')


          def require_branch(api, branch, sha, deletable=False):
              data = api.get(branch_path(branch))
              require(data.get('name') == branch and data.get('commit', {}).get('sha') == sha,
                      'Branch tip changed or branch response mismatched: ' + branch)
              if deletable:
                  require(data.get('protected') is False, 'Protected or unknown-protection target: ' + branch)
                  rules = api.get('/rules/branches/' + urllib.parse.quote(branch, safe=''))
                  require(isinstance(rules, list) and not rules, 'Active branch rules prevent cleanup: ' + branch)


          def require_ancestor(api, ancestor, baseline):
              data = api.get('/compare/' + ancestor + '...' + baseline + '?per_page=100')
              # These audited comparisons have fewer than 100 commits. Unexpected pagination
              # is rejected by the API client rather than accepting a partial response.
              require(data.get('base_commit', {}).get('sha') == ancestor
                      and data.get('merge_base_commit', {}).get('sha') == ancestor
                      and data.get('status') in ('ahead', 'identical')
                      and data.get('behind_by') == 0
                      and type(data.get('ahead_by')) is int
                      and data['ahead_by'] >= 0,
                      'Commit is not proven reachable from audited main.')
              require((data['status'] == 'identical') == (ancestor == baseline),
                      'Inconsistent comparison status.')


          def verify_preflight(config, api, run_sha):
              repo = api.get('')
              require(repo.get('full_name') == config['repository']
                      and repo.get('default_branch') == 'main'
                      and repo.get('archived') is False and repo.get('disabled') is False,
                      'Repository identity, default branch, or availability changed.')
              require_branch(api, 'main', run_sha)
              commit = api.get('/commits/' + run_sha + '?per_page=100')
              require(commit.get('sha') == run_sha
                      and [parent.get('sha') for parent in commit.get('parents', [])] == [config['baseline']],
                      'Publication is not a single-parent child of audited main.')
              files = commit.get('files')
              require(isinstance(files, list) and len(files) == 1
                      and files[0].get('filename') == WORKFLOW_PATH
                      and files[0].get('status') == 'added'
                      and not files[0].get('previous_filename'),
                      'Publication changed something other than the new one-time workflow.')
              for branch, sha in config['preserved'].items():
                  require_branch(api, branch, sha)
              for target in config['targets']:
                  name, sha = target['branch'], target['sha']
                  require_branch(api, name, sha, deletable=True)
                  pull = api.get('/pulls/' + str(target['pr']))
                  require(pull.get('number') == target['pr'] and pull.get('state') == 'closed'
                          and pull.get('merged') is True and bool(pull.get('merged_at'))
                          and pull.get('head', {}).get('sha') == sha
                          and pull.get('head', {}).get('ref') == name
                          and (pull.get('head', {}).get('repo') or {}).get('full_name') == config['repository']
                          and pull.get('base', {}).get('ref') == target['base']
                          and (pull.get('base', {}).get('repo') or {}).get('full_name') == config['repository'],
                          'Merged pull request evidence changed: ' + name)
                  if 'squash' in target:
                      require(pull.get('merge_commit_sha') == target['squash'], 'Squash PR commit changed.')
                      require_ancestor(api, target['squash'], config['baseline'])
                      head = api.get('/git/commits/' + sha)
                      squash = api.get('/git/commits/' + target['squash'])
                      require(head.get('sha') == sha and squash.get('sha') == target['squash']
                              and head.get('tree', {}).get('sha') == target['tree']
                              and squash.get('tree', {}).get('sha') == target['tree'],
                              'Squash exception lacks identical complete Git trees.')
                  else:
                      require_ancestor(api, sha, config['baseline'])
              # Repeat mutable facts once immediately before the atomic operation. The exact
              # deletion leases guard target races; main itself is intentionally never pushed.
              require(api.get('').get('default_branch') == 'main', 'Default branch changed during preflight.')
              require_branch(api, 'main', run_sha)
              for target in config['targets']:
                  require_branch(api, target['branch'], target['sha'], deletable=True)
              for branch, sha in config['preserved'].items():
                  require_branch(api, branch, sha)


          def deletion_arguments(config):
              validate_config(config)
              leases = ['--force-with-lease=refs/heads/' + t['branch'] + ':' + t['sha']
                        for t in config['targets']]
              refspecs = [':refs/heads/' + t['branch'] for t in config['targets']]
              return ['push', '--atomic', '--porcelain', '--no-verify', '--no-follow-tags',
                      *leases, 'https://github.com/' + config['repository'] + '.git', *refspecs]


          class GitTransport:
              """An empty bare repository; the sole possible remote write is delete_once."""
              def __init__(self, config, token, temporary_directory):
                  self.config = config
                  self.directory = Path(temporary_directory)
                  self.bare = self.directory / 'empty.git'
                  self.mutation_started = False
                  askpass = self.directory / 'askpass.sh'
                  # The script contains no token value. Git reads it from the environment.
                  askpass.write_text('#!/bin/sh\ncase "$1" in\n'
                                     '  *Username*) printf "%s\\n" "x-access-token" ;;\n'
                                     '  *Password*) printf "%s\\n" "$GITHUB_TOKEN" ;;\n'
                                     '  *) exit 1 ;;\nesac\n', encoding='utf-8')
                  askpass.chmod(0o700)
                  self.env = {'PATH': '/usr/bin:/bin', 'HOME': str(self.directory),
                              'LANG': 'C', 'LC_ALL': 'C', 'GIT_CONFIG_NOSYSTEM': '1',
                              'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_TERMINAL_PROMPT': '0',
                              'GIT_ASKPASS': str(askpass), 'GITHUB_TOKEN': token,
                              'GIT_ALLOW_PROTOCOL': 'https'}
                  self._execute(['init', '--bare', '--quiet', str(self.bare)])

              def _execute(self, arguments):
                  command = ['/usr/bin/git', '-c', 'credential.helper=', '-c', 'core.hooksPath=/dev/null',
                             '-c', 'http.followRedirects=false', '-c', 'http.sslVerify=true',
                             '-c', 'push.followTags=false', '-c', 'push.recurseSubmodules=no',
                             *arguments]
                  try:
                      result = subprocess.run(command, env=self.env, cwd=self.directory,
                                              capture_output=True, text=True, timeout=90, check=False)
                  except (subprocess.TimeoutExpired, OSError):
                      raise SafetyError('Git operation timed out or failed; outcome must be checked, never retried.') from None
                  # Captured output is never printed, included in exceptions, or persisted.
                  require(result.returncode == 0, 'Git operation failed; no fallback or mutation retry is allowed.')
                  return result.stdout

              def list_heads(self):
                  output = self._execute(['--git-dir=' + str(self.bare), 'ls-remote', '--heads',
                                         'https://github.com/' + self.config['repository'] + '.git'])
                  refs = {}
                  for line in output.splitlines():
                      parts = line.split('\t')
                      require(len(parts) == 2 and SHA.fullmatch(parts[0]) is not None
                              and parts[1].startswith('refs/heads/'), 'Malformed remote head listing.')
                      require(parts[1] not in refs, 'Duplicate remote head.')
                      refs[parts[1]] = parts[0]
                  return refs

              def delete_once(self):
                  require(not self.mutation_started, 'A second mutation is forbidden.')
                  self.mutation_started = True  # Set before starting, including uncertain outcomes.
                  self._execute(['--git-dir=' + str(self.bare), *deletion_arguments(self.config)])


          def expected_heads(config, run_sha):
              return {'refs/heads/main': run_sha,
                      **{'refs/heads/' + t['branch']: t['sha'] for t in config['targets']},
                      **{'refs/heads/' + name: sha for name, sha in config['preserved'].items()}}


          def require_remote_heads(config, transport, run_sha, after=False):
              heads = transport.list_heads()
              require(heads.get('refs/heads/main') == run_sha, 'Remote main changed.')
              for name, sha in config['preserved'].items():
                  require(heads.get('refs/heads/' + name) == sha, 'Preserved branch changed: ' + name)
              for target in config['targets']:
                  ref = 'refs/heads/' + target['branch']
                  require((ref not in heads) if after else (heads.get(ref) == target['sha']),
                          'Post-deletion verification failed.' if after else 'Remote target tip changed.')
              return heads


          def perform_cleanup(config, api, transport, env, event, now):
              run_sha = validate_context(config, env, event, now)
              verify_preflight(config, api, run_sha)
              before_heads = require_remote_heads(config, transport, run_sha)
              # Every target has passed every check. No network mutation occurs before here.
              mutation_error = None
              try:
                  transport.delete_once()
              except SafetyError as error:
                  mutation_error = error
              # Always attempt a read-only check, even after a rejected or uncertain push.
              # Never turn a timeout or transport failure into a second mutation.
              after_heads = require_remote_heads(config, transport, run_sha, after=True)
              untouched = set(before_heads) - {'refs/heads/' + t['branch'] for t in config['targets']}
              require(all(after_heads.get(ref) == before_heads[ref] for ref in untouched),
                      'An unrelated branch changed concurrently; inspect before removing the workflow.')
              require_branch(api, 'main', run_sha)
              if mutation_error is not None:
                  raise SafetyError('Atomic push did not report success, but read-only verification found all target refs absent and preserved refs unchanged. Inspect the result; do not rerun.')
              return run_sha


          def main():
              run_sha = None
              status = 'NOT VERIFIED'
              message = 'Stopped without a verified result. Do not rerun; inspect repository refs.'
              try:
                  require(CONFIG is not None, 'Repository-specific config was not embedded.')
                  # Verify event/context before any API request, credential handling, or Git.
                  event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
                  now = datetime.datetime.now(datetime.timezone.utc)
                  run_sha = validate_context(CONFIG, os.environ, event, now)
                  token = os.environ.get('GITHUB_TOKEN', '')
                  require(bool(token), 'Ephemeral job token missing.')
                  api = GitHubReadAPI(CONFIG['repository'], token)
                  with tempfile.TemporaryDirectory(prefix='reviewed-branch-cleanup-') as directory:
                      transport = GitTransport(CONFIG, token, directory)
                      run_sha = perform_cleanup(CONFIG, api, transport, os.environ, event, now)
                  status = 'VERIFIED'
                  message = ('Deleted exactly %s audited branches in one atomic, SHA-leased push. '
                             'main and preserved refs were unchanged. Remove this one-time workflow.') % len(CONFIG['targets'])
                  print(message)
              except SafetyError as error:
                  message = str(error)
                  print('Cleanup stopped: ' + message)
                  raise SystemExit(1) from None
              except Exception:
                  # Never print a traceback, response body, credentials, or subprocess output.
                  message = 'Unexpected failure; inspect branch state before any further mutation. No retry was attempted.'
                  print('Cleanup stopped: ' + message)
                  raise SystemExit(1) from None
              finally:
                  summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary_path and CONFIG is not None:
                      with open(summary_path, 'a', encoding='utf-8') as summary:
                          summary.write('One-time audited branch cleanup: ' + status + '\n\n' + message + '\n\n')
                          summary.write('Repository: ' + CONFIG['repository'] + '\n')
                          summary.write('Audited main: ' + CONFIG['baseline'] + '\n')
                          if run_sha:
                              summary.write('Workflow commit: ' + run_sha + '\n')
                          summary.write('Fixed cleanup inventory:\n')
                          for target in CONFIG['targets']:
                              summary.write('- ' + target['branch'] + ' at ' + target['sha']
                                            + ' (merged PR #' + str(target['pr']) + ')\n')


          if __name__ == '__main__':
              main()
          PYTHON_CLEANUP
